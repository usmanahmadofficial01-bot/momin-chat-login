<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Momin Chat</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #111827;
    }

    .app {
      max-width: 600px;
      min-height: 100vh;
      margin: auto;
      background: white;
    }

    .header {
      background: #16a34a;
      color: white;
      padding: 18px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 23px;
    }

    .header p {
      margin: 6px 0 0;
      font-size: 13px;
    }

    .screen {
      padding: 20px;
    }

    .center {
      text-align: center;
      padding-top: 45px;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 13px 18px;
      font-size: 15px;
      cursor: pointer;
    }

    .facebook-btn {
      width: 100%;
      margin-top: 20px;
      background: #1877f2;
      color: white;
    }

    .logout-btn {
      width: 100%;
      margin-top: 20px;
      background: #ef4444;
      color: white;
    }

    .search-box {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
      margin-bottom: 15px;
    }

    .user-card {
      display: flex;
      align-items: center;
      padding: 12px;
      border-bottom: 1px solid #e5e7eb;
      cursor: pointer;
    }

    .avatar {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      object-fit: cover;
      margin-right: 12px;
      background: #d1d5db;
    }

    .user-name {
      font-weight: bold;
    }

    .online {
      color: #16a34a;
      font-size: 12px;
      margin-top: 3px;
    }

    .offline {
      color: #6b7280;
      font-size: 12px;
      margin-top: 3px;
    }

    .profile {
      text-align: center;
      padding: 20px;
      border-bottom: 1px solid #e5e7eb;
    }

    .profile img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
    }

    .status {
      color: #16a34a;
      font-size: 13px;
      margin-top: 8px;
    }

    .error {
      color: #dc2626;
      margin-top: 15px;
      font-size: 13px;
    }

    .hidden {
      display: none !important;
    }

    .chat-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
      background: #16a34a;
      color: white;
    }

    .back-btn {
      background: transparent;
      color: white;
      font-size: 22px;
      padding: 5px 10px;
    }

    .chat-name {
      font-weight: bold;
    }

    .messages {
      height: calc(100vh - 210px);
      min-height: 400px;
      overflow-y: auto;
      padding: 15px;
      background: #efeae2;
    }

    .message-row {
      display: flex;
      margin-bottom: 8px;
    }

    .mine {
      justify-content: flex-end;
    }

    .message {
      max-width: 78%;
      padding: 9px 11px;
      border-radius: 9px;
      font-size: 14px;
      word-wrap: break-word;
    }

    .mine .message {
      background: #d9fdd3;
    }

    .theirs .message {
      background: white;
    }

    .message-time {
      font-size: 10px;
      color: #6b7280;
      text-align: right;
      margin-top: 4px;
    }

    .blue {
      color: #2563eb;
    }

    .send-area {
      display: flex;
      gap: 8px;
      padding: 10px;
      border-top: 1px solid #ddd;
    }

    .message-input {
      flex: 1;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 20px;
      outline: none;
    }

    .send-btn {
      background: #16a34a;
      color: white;
      border-radius: 20px;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="header">
    <h1>Momin Chat</h1>
    <p>Private messaging</p>
  </div>

  <div id="loginScreen" class="screen center">

    <h2>Welcome to Momin Chat</h2>

    <p>Sign in securely to start chatting.</p>

    <button id="facebookLogin" class="facebook-btn">
      Continue with Facebook
    </button>

    <div id="loginError" class="error"></div>

  </div>


  <div id="homeScreen" class="hidden">

    <div class="profile">

      <img id="myPhoto" src="" alt="Profile">

      <h3 id="myName"></h3>

      <div class="status">
        Online
      </div>

    </div>


    <div class="screen">

      <input
        id="searchInput"
        class="search-box"
        type="text"
        placeholder="Search users..."
      >

      <div id="usersList"></div>

      <button id="logoutButton" class="logout-btn">
        Sign Out
      </button>

    </div>

  </div>


  <div id="chatScreen" class="hidden">

    <div class="chat-header">

      <button id="backButton" class="back-btn">
        ←
      </button>

      <img
        id="chatPhoto"
        class="avatar"
        src=""
        alt="Profile"
      >

      <div>
        <div id="chatName" class="chat-name"></div>
        <div id="chatStatus"></div>
      </div>

    </div>


    <div id="messages" class="messages"></div>


    <div class="send-area">

      <input
        id="messageInput"
        class="message-input"
        type="text"
        placeholder="Type a message..."
      >

      <button id="sendButton" class="send-btn">
        Send
      </button>

    </div>

  </div>

</div>


<script type="module">

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";


  import {
    getAuth,
    FacebookAuthProvider,
    signInWithRedirect,
    getRedirectResult,
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";


  import {
    getFirestore,
    doc,
    setDoc,
    getDoc,
    collection,
    getDocs,
    query,
    orderBy,
    addDoc,
    onSnapshot,
    updateDoc,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js";


  const firebaseConfig = {

    apiKey:
      "AIzaSyAtQTsqYdD97pD4bOhMmD37yY8Q-zyDUfE",

    authDomain:
      "momin-chat-74a0e.firebaseapp.com",

    projectId:
      "momin-chat-74a0e",

    storageBucket:
      "momin-chat-74a0e.firebasestorage.app",

    messagingSenderId:
      "1038313929500",

    appId:
      "1:1038313929500:web:a9f14d29ff6b58863fd8d9",

    measurementId:
      "G-QRYL7GM7LE"
  };


  const app =
    initializeApp(firebaseConfig);


  const auth =
    getAuth(app);


  const db =
    getFirestore(app);


  const provider =
    new FacebookAuthProvider();


  provider.addScope("email");


  let currentUser = null;

  let currentChatUser = null;

  let unsubscribeMessages = null;


  const loginScreen =
    document.getElementById("loginScreen");

  const homeScreen =
    document.getElementById("homeScreen");

  const chatScreen =
    document.getElementById("chatScreen");

  const loginButton =
    document.getElementById("facebookLogin");

  const loginError =
    document.getElementById("loginError");

  const usersList =
    document.getElementById("usersList");

  const searchInput =
    document.getElementById("searchInput");

  const myPhoto =
    document.getElementById("myPhoto");

  const myName =
    document.getElementById("myName");

  const logoutButton =
    document.getElementById("logoutButton");

  const messages =
    document.getElementById("messages");

  const messageInput =
    document.getElementById("messageInput");

  const sendButton =
    document.getElementById("sendButton");


  /*
    Facebook Login
  */

  loginButton.addEventListener(
    "click",
    async () => {

      loginError.textContent =
        "Connecting to Facebook...";

      loginButton.disabled = true;

      try {

        await signInWithRedirect(
          auth,
          provider
        );

      } catch (error) {

        console.error(error);

        loginButton.disabled = false;

        loginError.textContent =
          error.message;

      }

    }
  );


  /*
    Complete Facebook Redirect
  */

  try {

    await getRedirectResult(auth);

  } catch (error) {

    console.error(error);

    loginError.textContent =
      "Facebook Login failed: " +
      error.message;

    loginButton.disabled = false;
  }


  /*
    Save User
  */

  async function saveUser(user) {

    const privateRef =
      doc(
        db,
        "users",
        user.uid
      );


    const privateSnapshot =
      await getDoc(privateRef);


    if (!privateSnapshot.exists()) {

      await setDoc(
        privateRef,
        {
          uid: user.uid,
          name: user.displayName || "User",
          email: user.email || "",
          photoURL: user.photoURL || "",
          createdAt: serverTimestamp()
        }
      );

    } else {

      await setDoc(
        privateRef,
        {
          name: user.displayName || "User",
          email: user.email || "",
          photoURL: user.photoURL || ""
        },
        {
          merge: true
        }
      );

    }


    const publicRef =
      doc(
        db,
        "publicProfiles",
        user.uid
      );


    await setDoc(
      publicRef,
      {
        uid: user.uid,
        name: user.displayName || "User",
        photoURL: user.photoURL || "",
        online: true,
        lastSeen: serverTimestamp()
      },
      {
        merge: true
      }
    );

  }


  /*
    Authentication State
  */

  onAuthStateChanged(
    auth,
    async (user) => {

      if (user) {

        currentUser = user;

        try {

          await saveUser(user);

        } catch (error) {

          console.error(error);

        }


        loginScreen.classList.add("hidden");

        chatScreen.classList.add("hidden");

        homeScreen.classList.remove("hidden");


        myName.textContent =
          user.displayName || "User";


        myPhoto.src =
          user.photoURL ||
          "https://via.placeholder.com/80";


        await loadUsers();

      } else {

        currentUser = null;

        loginScreen.classList.remove("hidden");

        homeScreen.classList.add("hidden");

        chatScreen.classList.add("hidden");

        loginButton.disabled = false;

      }

    }
  );


  /*
    Load Users
  */

  async function loadUsers(
    searchText = ""
  ) {

    usersList.innerHTML =
      "<p>Loading users...</p>";


    try {

      const snapshot =
        await getDocs(
          collection(
            db,
            "publicProfiles"
          )
        );


      usersList.innerHTML = "";


      let found = 0;


      snapshot.forEach(
        (docSnap) => {

          const user =
            docSnap.data();


          if (
            !currentUser ||
            user.uid === currentUser.uid
          ) {

            return;

          }


          const name =
            (
              user.name || "User"
            ).toLowerCase();


          if (
            searchText &&
            !name.includes(
              searchText.toLowerCase()
            )
          ) {

            return;

          }


          found++;


          const card =
            document.createElement("div");


          card.className =
            "user-card";


          card.innerHTML = `

            <img
              class="avatar"
              src="${
                user.photoURL ||
                "https://via.placeholder.com/45"
              }"
              alt="Profile"
            >

            <div>

              <div class="user-name">
                ${escapeHtml(
                  user.name || "User"
                )}
              </div>

              <div class="${
                user.online
                  ? "online"
                  : "offline"
              }">

                ${
                  user.online
                    ? "Online"
                    : "Offline"
                }

              </div>

            </div>

          `;


          card.addEventListener(
            "click",
            () => openChat(user)
          );


          usersList.appendChild(card);

        }
      );


      if (found === 0) {

        usersList.innerHTML =
          "<p>No users found.</p>";

      }


    } catch (error) {

      console.error(error);

      usersList.innerHTML =
        "<p>Unable to load users.</p>";

    }

  }


  searchInput.addEventListener(
    "input",
    () => {

      loadUsers(
        searchInput.value.trim()
      );

    }
  );


  /*
    Open Chat
  */

  async function openChat(user) {

    currentChatUser = user;


    homeScreen.classList.add("hidden");

    chatScreen.classList.remove("hidden");


    document.getElementById(
      "chatName"
    ).textContent =
      user.name || "User";


    document.getElementById(
      "chatPhoto"
    ).src =
      user.photoURL ||
      "https://via.placeholder.com/45";


    document.getElementById(
      "chatStatus"
    ).textContent =
      user.online
        ? "Online"
        : "Offline";


    await loadMessages();

  }


  /*
    Conversation ID
  */

  function getConversationId(
    uid1,
    uid2
  ) {

    return [
      uid1,
      uid2
    ]
      .sort()
      .join("_");

  }


  /*
    Load Messages
  */

  async function loadMessages() {

    if (
      !currentUser ||
      !currentChatUser
    ) {

      return;

    }


    if (unsubscribeMessages) {

      unsubscribeMessages();

      unsubscribeMessages = null;

    }


    const conversationId =
      getConversationId(
        currentUser.uid,
        currentChatUser.uid
      );


    const conversationRef =
      doc(
        db,
        "conversations",
        conversationId
      );


    const conversationSnapshot =
      await getDoc(
        conversationRef
      );


    if (
      !conversationSnapshot.exists()
    ) {

      await setDoc(
        conversationRef,
        {
          participantIds: [
            currentUser.uid,
            currentChatUser.uid
          ],
          createdAt: serverTimestamp(),
          updatedAt: serverTimestamp()
        }
      );

    }


    const messagesRef =
      collection(
        db,
        "conversations",
        conversationId,
        "messages"
      );


    const messagesQuery =
      query(
        messagesRef,
        orderBy(
          "createdAt",
          "asc"
        )
      );


    unsubscribeMessages =
      onSnapshot(
        messagesQuery,
        (snapshot) => {

          messages.innerHTML = "";


          snapshot.forEach(
            (messageDoc) => {

              displayMessage(
                messageDoc.id,
                messageDoc.data()
              );

            }
          );


          messages.scrollTop =
            messages.scrollHeight;

        },
        (error) => {

          console.error(error);

          messages.innerHTML =
            "<p>Unable to load messages.</p>";

        }
      );

  }


  /*
    Display Message
  */

  function displayMessage(
    id,
    data
  ) {

    const row =
      document.createElement("div");


    const mine =
      data.senderId ===
      currentUser.uid;


    row.className =
      "message-row " +
      (
        mine
          ? "mine"
          : "theirs"
      );


    const bubble =
      document.createElement("div");


    bubble.className =
      "message";


    const text =
      document.createElement("div");


    text.textContent =
      data.text || "";


    const time =
      document.createElement("div");


    time.className =
      "message-time";


    let timeText = "";


    if (data.createdAt) {

      const date =
        data.createdAt.toDate();


      timeText =
        date.toLocaleTimeString(
          [],
          {
            hour: "2-digit",
            minute: "2-digit"
          }
        );

    }


    let ticks = "";


    if (mine) {

      if (data.read) {

        ticks =
          '<span class="blue">✓✓</span>';

      } else if (
        data.delivered
      ) {

        ticks =
          "<span>✓✓</span>";

      } else {

        ticks =
          "<span>✓</span>";

      }

    }


    time.innerHTML =
      timeText +
      " " +
      ticks;


    bubble.appendChild(text);

    bubble.appendChild(time);

    row.appendChild(bubble);

    messages.appendChild(row);


    if (
      !mine &&
      !data.read
    ) {

      const conversationId =
        getConversationId(
          currentUser.uid,
          currentChatUser.uid
        );


      const messageRef =
        doc(
          db,
          "conversations",
          conversationId,
          "messages",
          id
        );


      updateDoc(
        messageRef,
        {
          delivered: true,
          read: true
        }
      ).catch(() => {});

    }

  }


  /*
    Send Message
  */

  async function sendMessage() {

    const text =
      messageInput.value.trim();


    if (
      !text ||
      !currentUser ||
      !currentChatUser
    ) {

      return;

    }


    const conversationId =
      getConversationId(
        currentUser.uid,
        currentChatUser.uid
      );


    try {

      await addDoc(
        collection(
          db,
          "conversations",
          conversationId,
          "messages"
        ),
        {
          senderId:
            currentUser.uid,

          receiverId:
            currentChatUser.uid,

          text:
            text,

          delivered:
            false,

          read:
            false,

          createdAt:
            serverTimestamp()
        }
      );


      await updateDoc(
        doc(
          db,
          "conversations",
          conversationId
        ),
        {
          updatedAt:
            serverTimestamp()
        }
      );


      messageInput.value = "";


    } catch (error) {

      console.error(error);

      alert(
        "Message could not be sent: " +
        error.message
      );

    }

  }


  sendButton.addEventListener(
    "click",
    sendMessage
  );


  messageInput.addEventListener(
    "keydown",
    (event) => {

      if (
        event.key === "Enter"
      ) {

        sendMessage();

      }

    }
  );


  /*
    Back Button
  */

  document
    .getElementById("backButton")
    .addEventListener(
      "click",
      () => {

        if (
          unsubscribeMessages
        ) {

          unsubscribeMessages();

          unsubscribeMessages =
            null;

        }


        currentChatUser = null;


        chatScreen.classList.add(
          "hidden"
        );

        homeScreen.classList.remove(
          "hidden"
        );


        loadUsers(
          searchInput.value.trim()
        );

      }
    );


  /*
    Sign Out
  */

  logoutButton.addEventListener(
    "click",
    async () => {

      if (currentUser) {

        await setDoc(
          doc(
            db,
            "publicProfiles",
            currentUser.uid
          ),
          {
            online: false,
            lastSeen:
              serverTimestamp()
          },
          {
            merge: true
          }
        );

      }


      await signOut(auth);

    }
  );


  /*
    Online heartbeat
  */

  setInterval(
    async () => {

      if (currentUser) {

        await setDoc(
          doc(
            db,
            "publicProfiles",
            currentUser.uid
          ),
          {
            online: true,
            lastSeen:
              serverTimestamp()
          },
          {
            merge: true
          }
        );

      }

    },
    60000
  );


  /*
    Escape HTML
  */

  function escapeHtml(value) {

    return String(value)
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );

  }

</script>

</body>
  </html>
